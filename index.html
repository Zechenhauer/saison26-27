<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saisonübersicht 3. Mannschaft — TV Kapellen 1919 e.V.</title>
    <style>
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        margin: 0;
        padding: 20px 15px;
    }
    .container { max-width: 950px; margin: 0 auto; }
    
    /* Zurück Button */
    .back-nav { margin-bottom: 15px; }
    .back-btn {
        display: inline-flex; align-items: center; gap: 8px;
        background: #1e293b; color: #f59e0b; text-decoration: none;
        padding: 8px 16px; border-radius: 20px; font-weight: bold;
        font-size: 13px; border: 1px solid #f59e0b;
        transition: all 0.2s ease;
    }
    .back-btn:hover { background: #f59e0b; color: #0f172a; }

    /* Suche */
    .search-wrapper {
        position: sticky; top: 15px; z-index: 90; margin-bottom: 25px; display: flex; justify-content: center;
    }
    .search-box-input {
        width: 100%; max-width: 500px; padding: 12px 24px; font-size: 14px;
        background-color: #1e293b; color: #ffffff; border: 2px solid #f59e0b;
        border-radius: 25px; outline: none; box-shadow: 0 4px 20px rgba(245, 158, 11, 0.15);
        text-align: center;
    }

    /* Navigation Spieltage */
    .nav-links {
        display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 25px;
        justify-content: center; background: #1e293b; padding: 12px;
        border-radius: 12px; border: 1px solid #334155;
    }
    .nav-links a {
        color: #cbd5e1; text-decoration: none; font-size: 12px; font-weight: bold;
        padding: 6px 12px; background: #0f172a; border-radius: 6px; border: 1px solid #334155;
        transition: all 0.2s;
    }
    .nav-links a:hover { border-color: #f59e0b; background: #f59e0b; color: #0f172a; }

    /* Highlights Kachel */
    .premium-highlight-card {
        background-color: #1e293b; border: 2px solid #f59e0b; border-radius: 12px;
        padding: 20px; margin-bottom: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .highlight-header { text-align: center; margin-bottom: 15px; }
    .highlight-header h1 { color: #f59e0b; margin: 0; font-size: 20px; letter-spacing: 0.5px; text-transform: uppercase; font-weight: 900; }
    .highlight-header .subtitle { color: #34d399; font-size: 12px; font-weight: bold; margin-top: 4px; letter-spacing: 0.5px; }

    .highlight-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .highlight-table th { background-color: #334155; color: #94a3b8; text-align: left; padding: 10px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    .highlight-table td { padding: 12px 6px; border-bottom: 1px solid #334155; font-size: 13px; }

    /* Matchday Card & Header */
    .card {
        background: #1e293b; border: 1px solid #334155; border-radius: 12px;
        margin-bottom: 30px; overflow: hidden; scroll-margin-top: 80px;
    }
    .card-header {
        background: #0f172a; padding: 15px; border-bottom: 1px solid #334155; text-align: center;
    }
    .spieltag-label {
        font-size: 12px; font-weight: bold; color: #94a3b8; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px;
    }
    
    .matchday-title-box {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        font-size: 18px; font-weight: 800; flex-wrap: wrap;
    }
    .team-badge { padding: 5px 12px; border-radius: 6px; font-weight: bold; color: #ffffff; }
    .team-badge.winner { background-color: #166534; color: #4ade80; border: 1px solid #22c55e; }
    .team-badge.loser { background-color: #991b1b; color: #fca5a5; border: 1px solid #ef4444; }
    .team-badge.draw { background-color: #9a3412; color: #ffedd5; border: 1px solid #f97316; }
    .team-badge.neutral { background-color: #334155; color: #ffffff; }

    .matchday-score {
        font-size: 22px; font-weight: 900; color: #f59e0b; background: #1e293b;
        padding: 4px 14px; border-radius: 8px; border: 1px solid #334155;
    }

    .block-title {
        background: #334155; color: #f59e0b; padding: 6px 12px; font-size: 12px;
        font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;
    }
    
    /* Match Row */
    .match-row {
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px 15px; border-bottom: 1px solid #334155; cursor: pointer;
        transition: background 0.15s ease;
    }
    .match-row:hover { background-color: #334155; }
    .match-num { width: 25px; color: #64748b; font-size: 12px; font-weight: bold; }
    .match-players { flex: 1; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; font-size: 14px; }
    .player-side { width: 42%; font-weight: 500; }
    .player-side.left { text-align: right; }
    .player-side.right { text-align: left; }
    .player-side.winner { color: #34d399; font-weight: bold; }
    .avg-tag { color: #94a3b8; font-size: 12px; font-weight: normal; margin: 0 4px; }
    .score-tag { background: #0f172a; color: #f59e0b; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-family: monospace; font-size: 14px; border: 1px solid #334155; min-width: 45px; text-align: center; }
    .stats-icon { color: #34d399; font-size: 14px; margin-left: 10px; }

    /* Modal Pop-Up */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(15, 23, 42, 0.85); display: none; justify-content: center;
        align-items: center; z-index: 1000; backdrop-filter: blur(4px);
    }
    .modal-content {
        background: #1e293b; border: 1px solid #f59e0b; width: 90%; max-width: 500px;
        border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        max-height: 90vh; overflow-y: auto;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 15px; }
    .modal-title { font-size: 16px; font-weight: bold; color: #fff; }
    .close-btn { background: none; border: none; color: #94a3b8; font-size: 22px; cursor: pointer; }
    .modal-section-title { color: #f59e0b; font-size: 12px; font-weight: bold; margin: 15px 0 8px 0; text-transform: uppercase; border-left: 3px solid #f59e0b; padding-left: 6px; }
    
    .modal-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 13px; }
    .modal-table th { background: #0f172a; color: #f59e0b; text-align: center; padding: 6px; font-size: 11px; }
    .modal-table td { padding: 8px; border-bottom: 1px solid #334155; text-align: center; }
    .modal-table td.p-name { text-align: left; font-weight: bold; }

    /* Styling für die Scoring-Tabelle */
    .scoring-header-row th {
        background-color: #991b1b !important;
        color: #ffffff !important;
        font-weight: bold;
        border: 1px solid #7f1d1d;
    }
    .scoring-table-body td {
        border: 1px solid #334155;
    }

    .row-faded { opacity: 0.2; }
    .row-matched { background-color: rgba(245, 158, 11, 0.15) !important; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Zurück Button -->
        <div class="back-nav">
            <a href="https://zechenhauer.github.io/TVK-3-Saison-26-27/" class="back-btn">
                <span>🔙</span> Zurück zur Hauptapp
            </a>
        </div>

        <!-- Live Suche -->
        <div class="search-wrapper">
            <input type="text" id="playerSearchInput" class="search-box-input" placeholder="🔍 Nach Spieler-Name suchen (z.B. Lenz)..." oninput="performLiveSearch()">
        </div>

        <div id="loadingMessage" style="text-align:center; color:#f59e0b; margin: 20px 0;">Lade Daten aus Google Sheets...</div>

        <!-- Highlight Karte -->
        <div class="premium-highlight-card" id="highlightsCard" style="display:none;">
            <div class="highlight-header">
                <h1>🏆 SAISON-HIGHLIGHTS & SCORING</h1>
                <div class="subtitle">ÜBERSICHT ALLER BESTLEISTUNGEN &mdash; 3. MANNSCHAFT</div>
            </div>
            <table class="highlight-table">
                <thead>
                    <tr>
                        <th style="width: 8%; text-align: center;">#</th>
                        <th style="width: 30%;">SPIELER</th>
                        <th style="width: 15%; text-align: center; color: #38bdf8;">🎯 140+</th>
                        <th style="width: 15%; text-align: center; color: #f59e0b;">🎯 180ER</th>
                        <th style="width: 15%; text-align: center; color: #34d399;">🎯 SL</th>
                        <th style="width: 17%; text-align: center; color: #ec4899;">HIGH FINISH</th>
                    </tr>
                </thead>
                <tbody id="highlightsTableBody"></tbody>
            </table>
        </div>

        <!-- Schnellnavigation -->
        <div class="nav-links" id="navLinks" style="display:none;"></div>

        <!-- Spieltage -->
        <div id="spieltageContainer"></div>
    </div>

    <!-- Modal Pop-Up -->
    <div class="modal-overlay" id="matchModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Match Details</div>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
    const SHEETS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTdTOUA5sqMlTVxxUZWLn-ce3HNDvCbLfmLZIgT7EKJ0tYAT3OqZhx3T_BMvpgIwU5tDUxmjvUIRbHz/pub?gid=0&single=true&output=csv&csvdelim=%2C";

    const teamKader = [
        "Jürgen Schützendorf", "Ludger Schledorn", "Markus Lenz", 
        "Niklas Weichert", "Andreas Denner", "Markus Ginsel", 
        "Dominik Helmke", "Michael Müller", "Florian Hartwich", "Lars Neutag"
    ];

    document.addEventListener("DOMContentLoaded", loadDataFromSheets);

    async function loadDataFromSheets() {
        try {
            const response = await fetch(SHEETS_CSV_URL);
            const dataText = await response.text();
            const rows = parseCSV(dataText);
            if(rows.length <= 1) return;
            processDartsData(rows);
        } catch (error) {
            console.error(error);
            document.getElementById("loadingMessage").innerHTML = "⚠️ Fehler beim Laden der Daten.";
        }
    }

    function parseCSV(text) {
        let lines = text.split(/\r?\n/);
        if (lines.length === 0) return [];
        let delimiter = lines[0].includes(";") ? ";" : ",";

        return lines.map(line => {
            let result = [], current = '', inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                let char = line[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === delimiter && !inQuotes) { result.push(current.trim()); current = ''; }
                else current += char;
            }
            result.push(current.trim());
            return result;
        }).filter(r => r.length > 1 && r[0] !== "");
    }

    function processDartsData(rows) {
        const dataRows = rows.slice(1);
        let spieltageMap = {};
        let spielerStats = {};
        
        teamKader.forEach(p => {
            spielerStats[p] = { shortGames: 0, count140: 0, hunderteachtziger: 0, topFinish: 0 };
        });

        dataRows.forEach((row, idx) => {
            const spieltagNum = row[0];
            const datum = row[1];
            const gegnerTeam = row[2] || "Gegner";
            const endergebnis = row[3] || "";
            const blockName = row[4] || "Spielblock";
            const spielerKapellen = row[5] || "";
            const gegnerName = row[6] || "";
            const ergebnisSpiel = row[7] || "-:-";
            const avg = row[8] || "";
            const dartsString = row[9] || "";
            const hunderteachtzigerRaw = row[11] || ""; // Spalte L
            const hfString = row[12] || "";              // Spalte M (HF)

            // Scoring-Spalten ab Spalte N:
            const score60 = row[13] || "0";  // Spalte N
            const score80 = row[14] || "0";  // Spalte O
            const score100 = row[15] || "0"; // Spalte P
            const score140 = row[16] || "0"; // Spalte Q

            if (!spieltagNum) return;

            // Short Legs aus Darts-String ermitteln
            let autoShortLegs = 0;
            let dartLegsArray = [];
            if (dartsString) {
                let splitDarts = dartsString.split(/[,|\/-]/);
                splitDarts.forEach(d => {
                    let dNum = parseInt(d.trim());
                    if (dNum) {
                        dartLegsArray.push(dNum);
                        if (dNum <= 18) autoShortLegs++;
                    }
                });
            }

            // Gesamtzahl 180er ermitteln (Text z.B. "Helmke, Weichert" -> 2)
            let match180Count = 0;
            if (hunderteachtzigerRaw.trim() !== "") {
                let matchesNumbers = hunderteachtzigerRaw.match(/\d+/g);
                if (matchesNumbers) {
                    match180Count = matchesNumbers.reduce((acc, curr) => acc + parseInt(curr), 0);
                } else {
                    let textEntries = hunderteachtzigerRaw.split(/[,|\/]/).map(s => s.trim()).filter(s => s.length > 0);
                    match180Count = textEntries.length;
                }
            }

            // 140er Anzahl ermitteln
            let parsed140Int = parseInt(score140) || 0;

            if (!spieltageMap[spieltagNum]) {
                spieltageMap[spieltagNum] = {
                    nummer: spieltagNum, datum: datum, gegnerTeam: gegnerTeam,
                    endergebnis: endergebnis, bloecke: {}, alleSpieler: new Set()
                };
            }

            let st = spieltageMap[spieltagNum];
            if (endergebnis && !st.endergebnis) st.endergebnis = endergebnis;
            if (!st.bloecke[blockName]) st.bloecke[blockName] = [];

            let matchObj = {
                id: idx,
                spieler: spielerKapellen, gegner: gegnerName, ergebnis: ergebnisSpiel,
                avg: avg, dartsArray: dartLegsArray, dartsRaw: dartsString,
                sgCount: autoShortLegs, achtzigerCount: match180Count, 
                achtzigerRaw: hunderteachtzigerRaw,
                hfString: hfString,
                scoring: {
                    s60: score60,
                    s80: score80,
                    s100: score100,
                    s140: score140,
                    s180: match180Count
                }
            };

            st.bloecke[blockName].push(matchObj);

            // Zuordnung der Spieler & Stats
            let beteiligteSpieler = spielerKapellen.split("/").map(s => s.trim()).filter(s => s !== "");
            
            beteiligteSpieler.forEach(subP => {
                if(subP) st.alleSpieler.add(subP.toLowerCase());
                
                let matchedKaderName = teamKader.find(tk => tk.toLowerCase() === subP.toLowerCase());
                if (matchedKaderName) {
                    spielerStats[matchedKaderName].shortGames += autoShortLegs;
                    spielerStats[matchedKaderName].count140 += parsed140Int;
                    
                    if (hfString) {
                        hfString.split(",").forEach(f => {
                            let fNum = parseInt(f.trim());
                            if (fNum && fNum > spielerStats[matchedKaderName].topFinish) {
                                spielerStats[matchedKaderName].topFinish = fNum;
                            }
                        });
                    }

                    if (hunderteachtzigerRaw) {
                        let rawLower = hunderteachtzigerRaw.toLowerCase();
                        let playerLastName = matchedKaderName.split(" ").pop().toLowerCase();

                        if (beteiligteSpieler.length > 1) {
                            if (rawLower.includes(playerLastName)) {
                                let numMatch = hunderteachtzigerRaw.match(new RegExp(playerLastName + "\\s*(\\d+)", "i"));
                                let countToAdd = numMatch ? parseInt(numMatch[1]) : 1;
                                spielerStats[matchedKaderName].hunderteachtziger += countToAdd;
                            } else if (!isNaN(parseInt(hunderteachtzigerRaw)) && !rawLower.match(/[a-z]/i)) {
                                spielerStats[matchedKaderName].hunderteachtziger += parseInt(hunderteachtzigerRaw);
                            }
                        } else {
                            spielerStats[matchedKaderName].hunderteachtziger += match180Count;
                        }
                    }
                }
            });
        });

        renderHighlightsTable(spielerStats);
        renderMatchdays(spieltageMap);

        document.getElementById("loadingMessage").style.display = "none";
        document.getElementById("highlightsCard").style.display = "block";
        document.getElementById("navLinks").style.display = "flex";
    }

    function renderHighlightsTable(stats) {
        // Sortierung nach: 140+ -> 180er -> Short Legs -> High Finish
        let sortedPlayers = teamKader.map(name => ({ name: name, ...stats[name] }))
        .sort((a, b) => b.count140 - a.count140 || b.hunderteachtziger - a.hunderteachtziger || b.shortGames - a.shortGames || b.topFinish - a.topFinish);

        let tbody = document.getElementById("highlightsTableBody");
        tbody.innerHTML = "";
        
        sortedPlayers.forEach((p, idx) => {
            let topFinishDisplay = p.topFinish > 0 ? `<span style="background:#ec4899; color:#fff; padding:2px 8px; border-radius:4px; font-weight:bold;">${p.topFinish}</span>` : '<span style="color:#64748b;">—</span>';

            tbody.innerHTML += `
                <tr class="hl-player-row" data-player-name="${p.name.toLowerCase()}">
                    <td style="text-align: center; font-weight: bold; color: #f59e0b;">${idx + 1}</td>
                    <td style="font-weight: bold; color: #ffffff;">${p.name}</td>
                    <td style="text-align: center; color: #38bdf8; font-weight: bold;">${p.count140}x</td>
                    <td style="text-align: center; color: #f59e0b; font-weight: bold;">${p.hunderteachtziger}x</td>
                    <td style="text-align: center; color: #34d399; font-weight: bold;">${p.shortGames}x</td>
                    <td style="text-align: center;">${topFinishDisplay}</td>
                </tr>
            `;
        });
    }

    let globalMatchStore = {};

    function renderMatchdays(spieltageMap) {
        let container = document.getElementById("spieltageContainer");
        let navLinks = document.getElementById("navLinks");
        container.innerHTML = "";
        navLinks.innerHTML = "";

        let sortedKeys = Object.keys(spieltageMap).sort((a, b) => parseInt(b) - parseInt(a));

        sortedKeys.forEach(key => {
            let st = spieltageMap[key];
            navLinks.innerHTML += `<a href="#spieltag-${st.nummer}">Spieltag ${st.nummer}</a>`;
            let playersDataAttr = Array.from(st.alleSpieler).join("||");

            let kapellenClass = "neutral";
            let gegnerClass = "neutral";
            let scoreDisplay = st.endergebnis || "-:-";

            if (st.endergebnis && st.endergebnis.includes(":")) {
                let parts = st.endergebnis.split(":");
                let kapScore = parseInt(parts[0].trim());
                let gegScore = parseInt(parts[1].trim());

                if (!isNaN(kapScore) && !isNaN(gegScore)) {
                    if (kapScore > gegScore) {
                        kapellenClass = "winner"; gegnerClass = "loser";
                    } else if (gegScore > kapScore) {
                        kapellenClass = "loser"; gegnerClass = "winner";
                    } else {
                        kapellenClass = "draw"; gegnerClass = "draw";
                    }
                }
            }

            let cardHtml = `
                <div class="card" id="spieltag-${st.nummer}" data-players="${playersDataAttr}">
                    <div class="card-header">
                        <div class="spieltag-label">SPIELTAG ${st.nummer} ${st.datum ? '&bull; ' + st.datum : ''}</div>
                        <div class="matchday-title-box">
                            <span class="team-badge ${kapellenClass}">TV Kapellen 3</span>
                            <span class="matchday-score">${scoreDisplay}</span>
                            <span class="team-badge ${gegnerClass}">${st.gegnerTeam}</span>
                        </div>
                    </div>
            `;

            let matchCounter = 1;
            Object.keys(st.bloecke).forEach(blockTitle => {
                cardHtml += `<div class="block-title">${blockTitle}</div>`;

                st.bloecke[blockTitle].forEach(match => {
                    globalMatchStore[match.id] = match;
                    
                    let leftWins = false, rightWins = false;
                    if (match.ergebnis && match.ergebnis.includes(":")) {
                        let parts = match.ergebnis.split(":");
                        if (parseInt(parts[0]) > parseInt(parts[1])) leftWins = true;
                        else if (parseInt(parts[1]) > parseInt(parts[0])) rightWins = true;
                    }

                    let searchRowPlayers = match.spieler.split("/").map(s => s.trim().toLowerCase()).join("||");

                    cardHtml += `
                        <div class="match-row" data-row-players="${searchRowPlayers}" onclick="openModal(${match.id})">
                            <div class="match-num">${matchCounter++}</div>
                            <div class="match-players">
                                <div class="player-side left ${leftWins ? 'winner' : ''}">
                                    ${match.spieler} <span class="avg-tag">(${match.avg || '—'})</span>
                                </div>
                                <div class="score-tag">${match.ergebnis}</div>
                                <div class="player-side right ${rightWins ? 'winner' : ''}">
                                    ${match.gegner}
                                </div>
                            </div>
                            <div class="stats-icon">📊</div>
                        </div>
                    `;
                });
            });

            cardHtml += `</div>`;
            container.innerHTML += cardHtml;
        });
    }

    function openModal(matchId) {
        let m = globalMatchStore[matchId];
        if(!m) return;

        document.getElementById("modalTitle").innerText = `${m.spieler} vs. ${m.gegner}`;
        
        let legsHtml = "";
        if (m.dartsArray.length > 0) {
            legsHtml = m.dartsArray.map((d, i) => `
                <tr>
                    <td>Leg ${i + 1}</td>
                    <td style="font-weight:bold; color:${d <= 18 ? '#34d399' : '#fff'}">${d} Darts ${d <= 18 ? '⚡ (SL)' : ''}</td>
                </tr>
            `).join("");
        } else {
            legsHtml = `<tr><td colspan="2">Keine Leg-Darts eingetragen</td></tr>`;
        }

        let isDoppel = m.spieler.includes("/");

        let display180 = "—";
        if (isDoppel) {
            if (m.achtzigerRaw && m.achtzigerRaw.trim() !== "") {
                display180 = m.achtzigerRaw; 
            } else if (m.achtzigerCount > 0) {
                display180 = m.achtzigerCount + "x";
            }
        } else {
            if (m.achtzigerCount > 0) {
                display180 = m.achtzigerCount + "x";
            }
        }

        document.getElementById("modalBody").innerHTML = `
            <div style="text-align:center; font-size: 20px; font-weight:bold; margin-bottom: 15px; color:#f59e0b;">
                Ergebnis: ${m.ergebnis}
            </div>
            
            <div class="modal-section-title">Averages</div>
            <table class="modal-table">
                <thead><tr><th>Spieler</th><th>3-Dart Avg</th></tr></thead>
                <tbody>
                    <tr><td class="p-name">${m.spieler}</td><td style="color:#f59e0b; font-weight:bold;">${m.avg || '—'}</td></tr>
                </tbody>
            </table>

            <div class="modal-section-title">Darts pro Leg</div>
            <table class="modal-table">
                <thead><tr><th>Leg</th><th>Geworfene Darts</th></tr></thead>
                <tbody>${legsHtml}</tbody>
            </table>

            <div class="modal-section-title">Scoring</div>
            <table class="modal-table">
                <thead>
                    <tr class="scoring-header-row">
                        <th style="text-align:left; width: 35%;"></th>
                        <th>60+</th>
                        <th>80+</th>
                        <th>100+</th>
                        <th>140+</th>
                        <th>180</th>
                    </tr>
                </thead>
                <tbody class="scoring-table-body">
                    <tr>
                        <td class="p-name">${m.spieler}</td>
                        <td>${m.scoring ? m.scoring.s60 : '0'}</td>
                        <td>${m.scoring ? m.scoring.s80 : '0'}</td>
                        <td>${m.scoring ? m.scoring.s100 : '0'}</td>
                        <td>${m.scoring ? m.scoring.s140 : '0'}</td>
                        <td>${m.scoring ? m.scoring.s180 : '0'}</td>
                    </tr>
                </tbody>
            </table>

            <div class="modal-section-title">Highlights Match</div>
            <div style="font-size:13px; background:#0f172a; padding:10px; border-radius:6px; border: 1px solid #334155;">
                🎯 <b>180er:</b> ${display180}<br>
                🔥 <b>High Finish:</b> ${m.hfString || '—'}<br>
                ⚡ <b>Short Legs (&le;18 Darts):</b> ${m.sgCount}x
            </div>
        `;

        document.getElementById("matchModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("matchModal").style.display = "none";
    }

    function performLiveSearch() {
        const query = document.getElementById('playerSearchInput').value.toLowerCase().trim();
        document.querySelectorAll('.hl-player-row').forEach(row => {
            const name = row.getAttribute('data-player-name') || '';
            if (query === '') row.classList.remove('row-faded', 'row-matched');
            else if (name.includes(query)) { row.classList.add('row-matched'); row.classList.remove('row-faded'); }
            else { row.classList.add('row-faded'); row.classList.remove('row-matched'); }
        });

        document.querySelectorAll('.card').forEach(card => {
            const cardPlayers = card.getAttribute('data-players') || '';
            if (query === '' || cardPlayers.includes(query)) {
                card.style.display = 'block';
                card.querySelectorAll('.match-row').forEach(row => {
                    const rowPlayers = row.getAttribute('data-row-players') || '';
                    if (query === '' || rowPlayers.includes(query)) {
                        row.classList.add('row-matched'); row.classList.remove('row-faded');
                    } else {
                        row.classList.add('row-faded'); row.classList.remove('row-matched');
                    }
                });
            } else { card.style.display = 'none'; }
        });
    }
    </script>
</body>
</html>
