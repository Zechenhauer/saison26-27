<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saisonübersicht 3. Mannschaft — TV Kapellen 1919 e.V.</title>
    <style>
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #121212;
        color: #e0e0e0;
        margin: 0;
        padding: 30px 15px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    
    .search-wrapper {
        position: sticky; top: 15px; z-index: 90; margin-bottom: 25px; display: flex; justify-content: center;
    }
    .search-box-input {
        width: 100%; max-width: 450px; padding: 12px 20px; font-size: 14px;
        background-color: #1e1e1e; color: #ffffff; border: 2px solid #b91c1c;
        border-radius: 25px; outline: none; box-shadow: 0 4px 15px rgba(185, 28, 28, 0.2);
    }

    /* Highlights Karte */
    .premium-highlight-card {
        background-color: #181818; border: 1px solid #2a2a2a; border-radius: 8px;
        padding: 20px; margin-bottom: 35px;
    }
    .highlight-header { text-align: center; border-bottom: 1px solid #333; padding-bottom: 12px; margin-bottom: 15px; }
    .highlight-header h1 { color: #b91c1c; margin: 0; font-size: 20px; letter-spacing: 1px; text-transform: uppercase; }
    .highlight-table { width: 100%; border-collapse: collapse; }
    .highlight-table th { background-color: #222; color: #888; text-align: left; padding: 10px; font-size: 11px; text-transform: uppercase; }
    .highlight-table td { padding: 10px; border-bottom: 1px solid #2a2a2a; font-size: 13px; }

    /* Matchday Card (Bild 1 Look) */
    .card {
        background: #181818; border: 1px solid #2a2a2a; border-radius: 8px;
        margin-bottom: 30px; overflow: hidden;
    }
    .card-header {
        background: #111; padding: 15px; border-bottom: 1px solid #222; text-align: center;
    }
    .block-title {
        background: #900000; color: #ffffff; padding: 6px 12px; font-size: 13px;
        font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;
    }
    
    /* Match Row */
    .match-row {
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px 15px; border-bottom: 1px solid #222; cursor: pointer;
        transition: background 0.15s ease;
    }
    .match-row:hover { background-color: #242424; }
    .match-num { width: 25px; color: #666; font-size: 12px; font-weight: bold; }
    .match-players { flex: 1; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; font-size: 14px; }
    .player-side { width: 42%; font-weight: 500; }
    .player-side.left { text-align: right; }
    .player-side.right { text-align: left; }
    .player-side.winner { color: #22c55e; font-weight: bold; }
    .avg-tag { color: #888; font-size: 12px; font-weight: normal; margin: 0 4px; }
    .score-tag { background: #000; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-family: monospace; font-size: 14px; }
    .stats-icon { color: #22c55e; font-size: 14px; margin-left: 10px; }

    /* Modal / Pop-Up Window (Bild 2 Look) */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.85); display: none; justify-content: center;
        align-items: center; z-index: 1000; backdrop-filter: blur(3px);
    }
    .modal-content {
        background: #181818; border: 1px solid #333; width: 90%; max-width: 500px;
        border-radius: 8px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        max-height: 90vh; overflow-y: auto;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
    .modal-title { font-size: 16px; font-weight: bold; color: #fff; }
    .close-btn { background: none; border: none; color: #888; font-size: 22px; cursor: pointer; }
    .modal-section-title { color: #fff; font-size: 13px; font-weight: bold; margin: 15px 0 8px 0; text-transform: uppercase; border-left: 3px solid #900000; padding-left: 6px; }
    
    .modal-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 13px; }
    .modal-table th { background: #900000; color: #fff; text-align: center; padding: 6px; font-size: 11px; }
    .modal-table td { padding: 8px; border-bottom: 1px solid #282828; text-align: center; }
    .modal-table td.p-name { text-align: left; font-weight: bold; }

    .row-faded { opacity: 0.15; }
    .row-matched { background-color: rgba(245, 158, 11, 0.15) !important; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; color: #b91c1c; text-transform: uppercase; font-size: 26px; font-weight: 900; margin: 0 0 20px 0;">Saisonübersicht &mdash; 3. Mannschaft</h1>
        
        <div class="search-wrapper">
            <input type="text" id="playerSearchInput" class="search-box-input" placeholder="🔍 Spieler suchen..." oninput="performLiveSearch()">
        </div>

        <div id="loadingMessage" style="text-align:center; color:#f59e0b;">Lade Daten...</div>

        <!-- Highlights Tabelle -->
        <div class="premium-highlight-card" id="highlightsCard" style="display:none;">
            <div class="highlight-header">
                <h1>🏆 SAISON-HIGHLIGHTS</h1>
            </div>
            <table class="highlight-table">
                <thead>
                    <tr>
                        <th style="width: 10%; text-align: center;">Platz</th>
                        <th style="width: 35%;">Spieler</th>
                        <th style="width: 18%; text-align: center;">🎯 Short Legs</th>
                        <th style="width: 18%; text-align: center;">🎯 180er</th>
                        <th style="width: 19%; text-align: center;">Top Finish</th>
                    </tr>
                </thead>
                <tbody id="highlightsTableBody"></tbody>
            </table>
        </div>

        <!-- Spieltage Container -->
        <div id="spieltageContainer"></div>
    </div>

    <!-- Pop-up Fenster -->
    <div class="modal-overlay" id="matchModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Match Details</div>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
    const SHEETS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTdTOUA5sqMlTVxxUZWLn-ce3HNDvCbLfmLZIgT7EKJ0tYAT3OqZhx3T_BMvpgIwU5tDUxmjvUIRbHz/pub?gid=0&single=true&output=csv&csvdelim=%2C";

    const teamKader = [
        "Jürgen Schützendorf", "Ludger Schledorn", "Markus Lenz", 
        "Niklas Weichert", "Andreas Denner", "Markus Ginsel", 
        "Dominik Helmke", "Michael Müller", "Florian Hartwich", "Thomas Kliver"
    ];

    document.addEventListener("DOMContentLoaded", loadDataFromSheets);

    async function loadDataFromSheets() {
        try {
            const response = await fetch(SHEETS_CSV_URL);
            const dataText = await response.text();
            const rows = parseCSV(dataText);
            if(rows.length <= 1) return;
            processDartsData(rows);
        } catch (error) {
            console.error(error);
            document.getElementById("loadingMessage").innerHTML = "⚠️ Fehler beim Laden der Daten.";
        }
    }

    function parseCSV(text) {
        let lines = text.split(/\r?\n/);
        if (lines.length === 0) return [];
        let delimiter = lines[0].includes(";") ? ";" : ",";

        return lines.map(line => {
            let result = [], current = '', inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                let char = line[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === delimiter && !inQuotes) { result.push(current.trim()); current = ''; }
                else current += char;
            }
            result.push(current.trim());
            return result;
        }).filter(r => r.length > 1 && r[0] !== "");
    }

    function processDartsData(rows) {
        const dataRows = rows.slice(1);
        let spieltageMap = {};
        let spielerStats = {};
        
        teamKader.forEach(p => {
            spielerStats[p] = { shortGames: 0, hunderteachtziger: 0, topFinish: 0 };
        });

        dataRows.forEach((row, idx) => {
            const spieltagNum = row[0];
            const datum = row[1];
            const gegnerTeam = row[2];
            const endergebnis = row[3];
            const blockName = row[4];
            const spielerKapellen = row[5];
            const gegnerName = row[6];
            const ergebnisSpiel = row[7];
            const avg = row[8];
            const dartsString = row[9] || "";
            const hunderteachtzigerCount = parseInt(row[11]) || 0;
            const hfString = row[12] || "";

            if (!spieltagNum) return;

            // Automatische Shortleg-Erkennung (alle Werte <= 18 Darts)
            let autoShortLegs = 0;
            let dartLegsArray = [];
            if (dartsString) {
                let splitDarts = dartsString.split(/[,|\/-]/);
                splitDarts.forEach(d => {
                    let dNum = parseInt(d.trim());
                    if (dNum) {
                        dartLegsArray.push(dNum);
                        if (dNum <= 18) autoShortLegs++; // Darts unter 19 = Shortleg!
                    }
                });
            }

            if (!spieltageMap[spieltagNum]) {
                spieltageMap[spieltagNum] = {
                    nummer: spieltagNum, datum: datum, gegnerTeam: gegnerTeam,
                    endergebnis: endergebnis, bloecke: {}, alleSpieler: new Set()
                };
            }

            let st = spieltageMap[spieltagNum];
            if (!st.bloecke[blockName]) st.bloecke[blockName] = [];

            let matchObj = {
                id: idx,
                spieler: spielerKapellen, gegner: gegnerName, ergebnis: ergebnisSpiel,
                avg: avg, dartsArray: dartLegsArray, dartsRaw: dartsString,
                sgCount: autoShortLegs, achtzigerCount: hunderteachtzigerCount, hfString: hfString
            };

            st.bloecke[blockName].push(matchObj);

            // Statistik für Kader-Spieler berechnen
            spielerKapellen.split("/").forEach(subP => {
                let cleanName = subP.trim();
                if(cleanName) st.alleSpieler.add(cleanName.toLowerCase());
                
                let matchedKaderName = teamKader.find(tk => tk.toLowerCase() === cleanName.toLowerCase());
                if (matchedKaderName) {
                    spielerStats[matchedKaderName].shortGames += autoShortLegs;
                    spielerStats[matchedKaderName].hunderteachtziger += hunderteachtzigerCount;
                    if (hfString) {
                        hfString.split(",").forEach(f => {
                            let fNum = parseInt(f.trim());
                            if (fNum && fNum > spielerStats[matchedKaderName].topFinish) {
                                spielerStats[matchedKaderName].topFinish = fNum;
                            }
                        });
                    }
                }
            });
        });

        renderHighlightsTable(spielerStats);
        renderMatchdays(spieltageMap);

        document.getElementById("loadingMessage").style.display = "none";
        document.getElementById("highlightsCard").style.display = "block";
    }

    function renderHighlightsTable(stats) {
        let sortedPlayers = teamKader.map(name => ({ name: name, ...stats[name] }))
        .sort((a, b) => b.shortGames - a.shortGames || b.hunderteachtziger - a.hunderteachtziger || b.topFinish - a.topFinish);

        let tbody = document.getElementById("highlightsTableBody");
        tbody.innerHTML = "";
        
        sortedPlayers.forEach((p, idx) => {
            tbody.innerHTML += `
                <tr class="hl-player-row" data-player-name="${p.name.toLowerCase()}">
                    <td style="text-align: center; font-weight: bold; color: #b91c1c;">${idx + 1}</td>
                    <td style="font-weight: bold; color: #ffffff;">${p.name}</td>
                    <td style="text-align: center; color: #22c55e; font-weight: bold;">${p.shortGames}x</td>
                    <td style="text-align: center; color: #f59e0b; font-weight: bold;">${p.hunderteachtziger}x</td>
                    <td style="text-align: center; font-weight: bold; color: #ec4899;">${p.topFinish > 0 ? p.topFinish : '—'}</td>
                </tr>
            `;
        });
    }

    let globalMatchStore = {};

    function renderMatchdays(spieltageMap) {
        let container = document.getElementById("spieltageContainer");
        container.innerHTML = "";
        let matchCounter = 1;

        Object.keys(spieltageMap).sort((a,b)=>parseInt(a)-parseInt(b)).forEach(key => {
            let st = spieltageMap[key];
            let playersDataAttr = Array.from(st.alleSpieler).join("||");

            let cardHtml = `
                <div class="card" data-players="${playersDataAttr}">
                    <div class="card-header">
                        <div style="font-size: 18px; font-weight: 900; color: #fff;">SPIELTAG ${st.nummer}</div>
                        <div style="font-size: 15px; color: #aaa; margin-top: 4px;">
                            TV Kapellen 3 <b style="color:#f59e0b;">${st.endergebnis}</b> ${st.gegnerTeam}
                        </div>
                    </div>
            `;

            Object.keys(st.bloecke).forEach(blockTitle => {
                cardHtml += `<div class="block-title">${blockTitle}</div>`;

                st.bloecke[blockTitle].forEach(match => {
                    globalMatchStore[match.id] = match;
                    
                    let leftWins = false, rightWins = false;
                    if (match.ergebnis.includes(":")) {
                        let parts = match.ergebnis.split(":");
                        if (parseInt(parts[0]) > parseInt(parts[1])) leftWins = true;
                        else if (parseInt(parts[1]) > parseInt(parts[0])) rightWins = true;
                    }

                    let searchRowPlayers = match.spieler.split("/").map(s => s.trim().toLowerCase()).join("||");

                    cardHtml += `
                        <div class="match-row" data-row-players="${searchRowPlayers}" onclick="openModal(${match.id})">
                            <div class="match-num">${matchCounter++}</div>
                            <div class="match-players">
                                <div class="player-side left ${leftWins ? 'winner' : ''}">
                                    ${match.spieler} <span class="avg-tag">(${match.avg || '—'})</span>
                                </div>
                                <div class="score-tag">${match.ergebnis}</div>
                                <div class="player-side right ${rightWins ? 'winner' : ''}">
                                    ${match.gegner}
                                </div>
                            </div>
                            <div class="stats-icon">📊</div>
                        </div>
                    `;
                });
            });

            cardHtml += `</div>`;
            container.innerHTML += cardHtml;
        });
    }

    // Modal Details (Bild 2 Look)
    function openModal(matchId) {
        let m = globalMatchStore[matchId];
        if(!m) return;

        document.getElementById("modalTitle").innerText = `${m.spieler} vs. ${m.gegner}`;
        
        let legsHtml = "";
        if (m.dartsArray.length > 0) {
            legsHtml = m.dartsArray.map((d, i) => `
                <tr>
                    <td>Leg ${i + 1}</td>
                    <td style="font-weight:bold; color:${d <= 18 ? '#22c55e' : '#fff'}">${d} Darts ${d <= 18 ? '⚡ (SL)' : ''}</td>
                </tr>
            `).join("");
        } else {
            legsHtml = `<tr><td colspan="2">Keine Leg-Darts eingetragen</td></tr>`;
        }

        document.getElementById("modalBody").innerHTML = `
            <div style="text-align:center; font-size: 20px; font-weight:bold; margin-bottom: 15px; color:#f59e0b;">
                Ergebnis: ${m.ergebnis}
            </div>
            
            <div class="modal-section-title">Averages</div>
            <table class="modal-table">
                <thead><tr><th>Spieler</th><th>3-Dart Avg</th></tr></thead>
                <tbody>
                    <tr><td class="p-name">${m.spieler}</td><td style="color:#f59e0b; font-weight:bold;">${m.avg || '—'}</td></tr>
                </tbody>
            </table>

            <div class="modal-section-title">Darts pro Leg</div>
            <table class="modal-table">
                <thead><tr><th>Leg</th><th>Geworfene Darts</th></tr></thead>
                <tbody>${legsHtml}</tbody>
            </table>

            <div class="modal-section-title">Highlights Match</div>
            <div style="font-size:13px; background:#111; padding:10px; border-radius:4px;">
                🎯 <b>180er:</b> ${m.achtzigerCount}x<br>
                🔥 <b>High Finish:</b> ${m.hfString || '—'}<br>
                ⚡ <b>Short Legs (&le;18 Darts):</b> ${m.sgCount}x
            </div>
        `;

        document.getElementById("matchModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("matchModal").style.display = "none";
    }

    function performLiveSearch() {
        const query = document.getElementById('playerSearchInput').value.toLowerCase().trim();
        document.querySelectorAll('.hl-player-row').forEach(row => {
            const name = row.getAttribute('data-player-name') || '';
            if (query === '') row.classList.remove('row-faded', 'row-matched');
            else if (name.includes(query)) { row.classList.add('row-matched'); row.classList.remove('row-faded'); }
            else { row.classList.add('row-faded'); row.classList.remove('row-matched'); }
        });

        document.querySelectorAll('.card').forEach(card => {
            const cardPlayers = card.getAttribute('data-players') || '';
            if (query === '' || cardPlayers.includes(query)) {
                card.style.display = 'block';
                card.querySelectorAll('.match-row').forEach(row => {
                    const rowPlayers = row.getAttribute('data-row-players') || '';
                    if (query === '' || rowPlayers.includes(query)) {
                        row.classList.add('row-matched'); row.classList.remove('row-faded');
                    } else {
                        row.classList.add('row-faded'); row.classList.remove('row-matched');
                    }
                });
            } else { card.style.display = 'none'; }
        });
    }
    </script>
</body>
</html>
